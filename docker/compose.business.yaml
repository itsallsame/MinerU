services:
  business-api:
    image: "${MINERU_BUSINESS_IMAGE:?Set a locally imported business API image tag}"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=1g
    environment:
      MINERU_BUSINESS_DB_PATH: /var/lib/mineru-business/business.sqlite3
      MINERU_BUSINESS_UPLOAD_ROOT: /srv/mineru-inbox
      MINERU_BUSINESS_DOCLIB_URL: http://doclib-worker:15980
      MINERU_BUSINESS_MAX_UPLOAD_BYTES: "${MINERU_BUSINESS_MAX_UPLOAD_BYTES:-104857600}"
      MINERU_BUSINESS_WEB_ROOT: /opt/mineru/business-web/dist
      MINERU_BUSINESS_REQUIRE_WEB: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
    volumes:
      - "${MINERU_BUSINESS_HOST_DIR:?Set the persistent business data directory}:/var/lib/mineru-business:rw"
      - "${MINERU_SHARED_DOCUMENTS_HOST_DIR:?Set the business upload directory}:/srv/mineru-inbox:rw"
    ports:
      - "${MINERU_BUSINESS_BIND_ADDRESS:-127.0.0.1}:${MINERU_BUSINESS_PORT:-8088}:8080"
    depends_on:
      - doclib-worker
    networks:
      - business-internal

  doclib-worker:
    image: "${MINERU_WORKER_IMAGE:?Set a locally imported worker image tag}"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=1g
    environment:
      MINERU_HOME: /var/lib/mineru
      MINERU_MODEL_BASE_DIR: /opt/mineru-models
      MINERU_MODEL_MANIFEST: /etc/mineru/model-manifest.json
      MINERU_MODEL_SOURCE: local
      MINERU_MODEL_SMALL_BACKEND: torch
      MINERU_MODEL_VLM_ENGINE: vllm
      MINERU_MODEL_VLM_SERVER_URL: ""
      MINERU_LLM_AIDED_FEATURES_TITLE_LEVELING: "false"
      MINERU_LLM_AIDED_FEATURES_CROSS_PAGE_TABLE_CELL_MERGE: "false"
      HF_HOME: /var/lib/mineru/hf-cache
      TORCH_HOME: /var/lib/mineru/torch-cache
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      MINERU_DOCLIB_UDS_ENABLED: "false"
      MINERU_DOCLIB_TCP_ENABLED: "true"
      MINERU_DOCLIB_TCP_HOST: 0.0.0.0
      MINERU_DOCLIB_TCP_STRICT_PORT: "true"
      MINERU_DOCLIB_COMPACTION_INTERVAL_SEC: "0"
    volumes:
      - "${MINERU_MODELS_HOST_DIR:?Set the model directory}:/opt/mineru-models:ro"
      - "${MINERU_MODEL_MANIFEST_HOST_FILE:?Set the model manifest file}:/etc/mineru/model-manifest.json:ro"
      - "${MINERU_DOCLIB_HOST_DIR:?Set the persistent Doclib directory}:/var/lib/mineru:rw"
      - "${MINERU_SHARED_DOCUMENTS_HOST_DIR:?Set the business upload directory}:/srv/mineru-inbox:ro"
    gpus: all
    networks:
      - business-internal

networks:
  business-internal:
    internal: true
