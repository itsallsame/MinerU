<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f6f4" />
    <title>MinerU · 文档工作台</title>
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">跳转到主要内容</a>
    <header class="topbar">
      <div class="brand" aria-label="MinerU 文档工作台">
        <span class="brand-mark" aria-hidden="true">M</span>
        <span><strong>MinerU</strong><small>文档工作台</small></span>
      </div>
      <div class="topbar-right">
        <span class="open-chip">开放系统 · 无需登录</span>
        <span id="connection" class="connection" role="status" aria-live="polite">正在连接服务…</span>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar" aria-label="上传和筛选">
        <div class="side-heading">
          <span class="eyebrow">WORKSPACE</span>
          <h1>让文档成为<br />可复查的知识</h1>
          <p>上传、解析、复核和确认，每一步都保留原文依据。</p>
        </div>

        <section class="panel upload-panel" aria-labelledby="upload-title">
          <div class="panel-head"><span class="section-number">01</span><h2 id="upload-title">添加文档</h2></div>
          <form id="upload-form">
            <label class="drop-zone" for="files">
              <span class="drop-icon" aria-hidden="true">↑</span>
              <strong>选择一份或多份文件</strong>
              <span>PDF、图片和常见办公文档</span>
              <input id="files" name="files" type="file" multiple required />
            </label>
            <p id="selected-files" class="selection-note">尚未选择文件</p>
            <label class="form-label" for="upload-template">业务模板</label>
            <select id="upload-template" name="template"><option value="">暂不分类</option></select>
            <label class="form-label" for="upload-tier">PDF / 图片解析档位</label>
            <select id="upload-tier" name="tier">
              <option value="flash">Flash · 快速预览</option>
              <option value="basic">Basic · 轻量处理</option>
              <option value="standard" selected>Standard · 日常高质量</option>
              <option value="advanced">Advanced · 复杂文档</option>
            </select>
            <p class="form-hint">Office 等原生格式固定使用 Flash；混合批次会逐文件选择正确档位。</p>
            <button id="upload-submit" class="primary-button" type="submit" disabled>开始上传与解析 <span aria-hidden="true">↗</span></button>
          </form>
          <div id="upload-feedback" class="feedback-list" role="status" aria-live="polite"></div>
          <p id="capability-note" class="capability-note">正在读取服务能力…</p>
        </section>

        <section class="side-note" aria-label="处理原则">
          <span class="side-note-icon" aria-hidden="true">◎</span>
          <p><strong>机器结果不是最终成果</strong><br />候选字段需复核，确认后才形成成果版本。</p>
        </section>
      </aside>

      <main id="main" class="main-content">
        <div class="page-heading">
          <div><span class="eyebrow">DOCUMENT LIBRARY</span><h2>文档与任务</h2><p>从原文件到可追溯结果，查看每份文档的当前进度。</p></div>
          <button id="refresh" class="secondary-button" type="button">刷新列表 <span aria-hidden="true">↻</span></button>
        </div>
        <div id="global-error" class="error-banner" role="alert" hidden></div>
        <section class="filterbar" aria-label="筛选文档">
          <label for="status-filter">任务状态
            <select id="status-filter">
              <option value="">全部状态</option>
              <option value="uploaded">待提交</option>
              <option value="submitted">解析中</option>
              <option value="done">已解析</option>
              <option value="failed">失败</option>
            </select>
          </label>
          <label for="template-filter">业务类型
            <select id="template-filter"><option value="">全部类型</option></select>
          </label>
          <span id="total-count" class="result-count">— 份文档</span>
        </section>
        <div id="document-list" class="document-list" aria-live="polite">
          <div class="empty-state">正在读取文档库…</div>
        </div>
        <nav class="pagination" aria-label="文档分页">
          <button id="previous-page" type="button" disabled>← 上一页</button>
          <span id="page-label">第 1 页</span>
          <button id="next-page" type="button" disabled>下一页 →</button>
        </nav>
      </main>

      <aside id="detail" class="detail-panel" aria-label="文档详情">
        <div id="detail-content" class="detail-empty">
          <span class="detail-empty-icon" aria-hidden="true">▤</span>
          <h2>选择一份文档</h2>
          <p>这里会展示原文、解析任务与修订记录。</p>
        </div>
      </aside>
    </div>
  </body>
</html>
